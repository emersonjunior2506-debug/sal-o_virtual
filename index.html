<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACE HAYR BY VALQUIRIA - Agendamento</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#C8B2DB;--bg2:#BA9ECE;--pri:#4A0E4E;--acc:#7B2CBF;--light:#F3E8FF;--text:#2D112C;--muted:#6B5B6E;--r:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{text-align:center;padding:2rem 1rem 1rem}
h1{font-family:'Montserrat',sans-serif;font-weight:900;font-size:clamp(1.6rem,4vw,3rem);color:var(--pri);letter-spacing:2px;text-transform:uppercase}
.sub{color:#5D2660;font-weight:500;font-size:.95rem}
main{flex:1;display:flex;justify-content:center;padding:1rem 1rem 260px}
.wiz{width:100%;max-width:680px;background:rgba(255,255,255,.93);border-radius:24px;padding:2rem;box-shadow:0 10px 30px rgba(74,14,78,.15);align-self:flex-start}
.prog{display:flex;gap:6px;margin-bottom:.5rem}
.prog i{flex:1;height:8px;border-radius:9px;background:rgba(74,14,78,.12);transition:.3s}
.prog i.on{background:linear-gradient(90deg,var(--pri),var(--acc))}
.plabel{font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:1.4rem;text-transform:uppercase;letter-spacing:1px}
.step{display:none;animation:in .35s ease}.step.active{display:block}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
label.l{display:block;font-size:.8rem;font-weight:700;color:var(--pri);text-transform:uppercase;margin:.9rem 0 .4rem}
input,textarea{width:100%;padding:.9rem 1rem;border:2px solid rgba(74,14,78,.15);border-radius:10px;font:inherit;outline:none;background:#fff}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(123,44,191,.15)}
.err{border-color:#d33!important}
.btn{background:linear-gradient(135deg,var(--acc),var(--pri));color:#fff;border:none;padding:.9rem 1.6rem;border-radius:10px;font:700 .95rem 'Poppins';cursor:pointer;transition:.25s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn2{background:none;border:2px solid rgba(107,91,110,.3);color:var(--muted);padding:.8rem 1.3rem;border-radius:10px;font:600 .9rem 'Poppins';cursor:pointer}
.btn2:hover{border-color:var(--pri);color:var(--pri)}
.wa{width:100%;background:#25D366;color:#fff;border:none;padding:1.1rem;border-radius:var(--r);font:800 1.05rem 'Poppins';cursor:pointer;box-shadow:0 8px 20px rgba(37,211,102,.35)}
.actions{display:flex;justify-content:space-between;gap:1rem;margin-top:1.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem;max-height:370px;overflow-y:auto;padding:4px 6px 4px 0}
.card{all:unset;box-sizing:border-box;background:#fff;border:2px solid rgba(74,14,78,.08);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative;transition:.25s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 12px 25px rgba(74,14,78,.2)}
.card.sel{border-color:var(--pri);background:#FDF8FF}
.card.sel::after{content:"✓";position:absolute;top:8px;right:8px;background:var(--pri);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.85rem}
.card img{width:100%;height:110px;object-fit:cover;background:linear-gradient(135deg,var(--bg1),var(--acc))}
.ph{height:110px;display:grid;place-items:center;font-size:2.6rem;background:linear-gradient(135deg,var(--bg1),var(--acc))}
.ci{padding:.9rem;display:flex;flex-direction:column;gap:.3rem;flex:1}
.cn{font-weight:700;font-size:.92rem}.cd{font-size:.76rem;color:var(--muted);line-height:1.3;flex:1}
.cf{display:flex;justify-content:space-between;border-top:1px solid rgba(0,0,0,.06);padding-top:.5rem;margin-top:.4rem}
.cp{font-weight:800;color:var(--pri)}.ct{font-size:.75rem;color:var(--muted)}
.bar{background:var(--light);padding:.9rem 1.1rem;border-radius:10px;display:flex;justify-content:space-between;align-items:center;margin-top:1rem}
.bar b{font-size:1.15rem;color:var(--pri)}.bar small{color:var(--muted);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;max-height:220px;overflow-y:auto;margin-top:.4rem}
.slot{background:#fff;border:1.5px solid rgba(74,14,78,.15);padding:.6rem 0;border-radius:10px;font:600 .85rem 'Poppins';cursor:pointer}
.slot:hover{background:var(--light);border-color:var(--acc)}.slot.sel{background:var(--pri);color:#fff}
.note{font-size:.85rem;color:var(--muted);padding:.8rem;background:var(--light);border-radius:10px;grid-column:1/-1}
.sum{background:#fff;border:1px solid rgba(74,14,78,.1);border-radius:var(--r);padding:1.2rem}
.row{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px dashed rgba(0,0,0,.1);font-size:.9rem}
.row span:first-child{color:var(--muted)}.row span:last-child{font-weight:700;text-align:right}
.tot{display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--pri);margin-top:.8rem;padding-top:.8rem}
.tot b{font-size:1.4rem;color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
@media(max-width:600px){.two{grid-template-columns:1fr}.slots{grid-template-columns:repeat(3,1fr)}.wiz{padding:1.3rem}}
.val{position:fixed;left:14px;bottom:14px;z-index:50;display:flex;flex-direction:column;align-items:flex-start;max-width:min(330px,calc(100% - 28px));pointer-events:none}
.bubble{pointer-events:auto;background:#fff;padding:1rem 1.2rem;border-radius:var(--r);box-shadow:0 12px 30px rgba(0,0,0,.18);margin:0 0 12px 12px;position:relative;font-size:.86rem;font-weight:600;line-height:1.45}
.bubble::after{content:'';position:absolute;bottom:-12px;left:30px;border:12px solid transparent;border-top-color:#fff;border-bottom:0;border-right:0}
.vn{color:var(--pri);font-weight:800}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--acc);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:none}30%{transform:translateY(-6px)}}
.av{pointer-events:auto;width:90px;height:90px;border-radius:50%;padding:4px;background:linear-gradient(135deg,var(--acc),var(--pri));box-shadow:0 10px 25px rgba(0,0,0,.25);position:relative;cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:2px solid #fff;background:var(--bg1)}
.av::after{content:'';position:absolute;right:4px;bottom:4px;width:16px;height:16px;background:#25D366;border:3px solid #fff;border-radius:50%}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-120px);background:#b00020;color:#fff;padding:.8rem 1.3rem;border-radius:10px;font-weight:600;font-size:.88rem;z-index:99;transition:.35s;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<header><h1>SPACE HAYR BY VALQUIRIA</h1><p class="sub">Agendamento online rápido e descomplicado</p></header>
<div class="toast" id="toast" role="alert"></div>

<main><div class="wiz">
  <div class="prog" id="prog"></div>
  <div class="plabel" id="plabel"></div>

  <section class="step active" id="step1">
    <label class="l" for="name">Como podemos te chamar?</label>
    <input id="name" placeholder="Seu nome" autocomplete="name" maxlength="40">
    <label class="l" for="phone">Seu WhatsApp (com DDD)</label>
    <input id="phone" placeholder="(19) 99999-9999" inputmode="tel" autocomplete="tel" maxlength="15">
    <div class="actions"><span></span><button class="btn" data-next>Avançar →</button></div>
  </section>

  <section class="step" id="step2">
    <label class="l" style="margin-top:0">Escolha os serviços <small style="text-transform:none;color:var(--muted)">(pode escolher mais de um)</small></label>
    <div class="grid" id="grid"></div>
    <div class="bar"><div><small id="cCount"></small><br><b id="cTotal"></b></div><small id="cTime"></small></div>
    <div class="actions"><button class="btn2" data-back>← Voltar</button><button class="btn" data-next>Continuar →</button></div>
  </section>

  <section class="step" id="step3">
    <div class="two">
      <div><label class="l" style="margin-top:0" for="date">Data</label><input type="date" id="date"></div>
      <div><label class="l" style="margin-top:0">Horário de início</label><div class="slots" id="slots"></div></div>
    </div>
    <div class="actions"><button class="btn2" data-back>← Voltar</button><button class="btn" data-next>Ver resumo →</button></div>
  </section>

  <section class="step" id="step4">
    <div class="sum">
      <div class="row"><span>Cliente</span><span id="sName"></span></div>
      <div class="row"><span>WhatsApp</span><span id="sPhone"></span></div>
      <div class="row"><span>Data e horário</span><span id="sDate"></span></div>
      <div id="sList" style="padding:.6rem 0"></div>
      <div class="tot"><div><b style="font-size:1.1rem;color:var(--pri)">Total</b><br><small id="sDur" style="color:var(--muted)"></small></div><b id="sTotal"></b></div>
    </div>
    <label class="l" for="obs">Alguma observação? (opcional)</label>
    <textarea id="obs" rows="2" maxlength="200" placeholder="Ex.: alergia, referência de cor, primeira visita..."></textarea>
    <div class="actions"><button class="btn2" data-back>✎ Alterar</button><button class="btn" data-next>Finalizar ✓</button></div>
  </section>

  <section class="step" id="step5" style="text-align:center">
    <div style="font-size:3rem">🎉</div>
    <h2 style="color:var(--pri);margin:.4rem 0">Tudo pronto para o seu dia de beleza!</h2>
    <p style="color:var(--muted);font-size:.9rem;margin-bottom:1.5rem">Envie os detalhes pelo WhatsApp para o salão confirmar seu horário.</p>
    <button class="wa" id="waBtn">ENVIAR PELO WHATSAPP</button>
    <p style="margin-top:1rem"><button class="btn2" style="border:none" id="restart">↻ Novo agendamento</button></p>
  </section>
</div></main>

<script>
/* ===== CONFIGURAÇÃO (edite aqui) ===== */
const CONFIG = {
  salonPhone: "5519991243240",
  open: "09:00", close: "19:00", interval: 30,
  lunch: ["12:00", "13:30"],   // intervalo sem atendimento (null para desativar)
  closedDays: [0],             // 0=domingo, 1=segunda...
  maxDaysAhead: 60,
  minNoticeMin: 60             // antecedência mínima para hoje
};
const SERVICES = [
  {id:'corte',name:'Corte Feminino',price:90,time:50,desc:'Corte moderno com lavagem e escova modeladora.',img:'photo-1562322140-8baeececf3df'},
  {id:'cor',name:'Coloração & Mechas',price:250,time:120,desc:'Iluminação premium ou cobertura completa.',img:'photo-1522337360788-8b13dee7a37e'},
  {id:'hidra',name:'Hidratação Profunda',price:120,time:45,desc:'Nutrição e restauração dos fios danificados.',img:'photo-1527799820374-dcf8d9d4a388'},
  {id:'pente',name:'Penteado & Escova',price:110,time:60,desc:'Modelagem para eventos ou dia a dia.',img:'photo-1487412720507-e7ab37603c6f'},
  {id:'selagem',name:'Selagem Progressiva',price:280,time:150,desc:'Alinhamento e redução de volume, com brilho e maciez por meses.',icon:'✨'},
  {id:'dep-intima',name:'Depilação Íntima',price:80,time:30,desc:'Atendimento reservado, com cuidado e total discrição.',icon:'🌸'},
  {id:'dep-corporal',name:'Depilação Corporal',price:90,time:45,desc:'Pernas, axilas, braços e outras áreas, conforme sua preferência.',icon:'🌿'}
];
const LABELS = ['Seus dados','Serviços','Data e horário','Resumo','Confirmação'];
const TOTAL = 5;

/* ===== ESTADO ===== */
let step = 1;
const S = {name:'', phone:'', services:[], date:'', time:'', obs:''};
const $ = id => document.getElementById(id);
const brl = n => 'R$ ' + n.toFixed(2).replace('.', ',');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const toHM = m => String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
const isoLocal = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const fmtDate = iso => iso.split('-').reverse().join('/');
const totals = () => ({
  price: S.services.reduce((a,s) => a + s.price, 0),
  time: S.services.reduce((a,s) => a + s.time, 0)
});
const fmtDur = m => m >= 60 ? Math.floor(m/60) + 'h' + (m%60 ? String(m%60).padStart(2,'0') : '') : m + ' min';

/* Horários já reservados neste aparelho (localStorage; use um backend para agenda real) */
const getBooked = () => { try { return JSON.parse(localStorage.getItem('sh_booked') || '[]'); } catch(e) { return []; } };
const addBooked = (date, start, end) => { try { const b = getBooked(); b.push({date, start, end}); localStorage.setItem('sh_booked', JSON.stringify(b)); } catch(e) {} };

/* ===== AVISOS ===== */
let toastT;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3000);
}
function flag(el) { el.classList.add('err'); el.focus(); setTimeout(() => el.classList.remove('err'), 1800); }

/* ===== VAL ===== */
const SAY = {
  1: () => `Olá, eu sou a <span class="vn">Val</span>! Vamos agendar seu atendimento? Primeiro me diga seu nome e WhatsApp.`,
  2: () => `Prazer, <span class="vn">${esc(S.name)}</span>! Escolha um ou mais serviços.`,
  3: () => `Ótimas escolhas! Agora escolha o dia e o horário. Mostro só os que cabem na duração (<b>${fmtDur(totals().time)}</b>).`,
  4: () => `<span class="vn">${esc(S.name)}</span>, confira os detalhes antes de finalizar.`,
  5: () => `Perfeito, <span class="vn">${esc(S.name)}</span>! Clique no botão verde para nos enviar. Te esperamos!`
};
let sayT;
function say(n) {
  const b = $('bubble');
  b.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  clearTimeout(sayT); sayT = setTimeout(() => { b.innerHTML = SAY[n](); }, 550);
}

/* ===== PROGRESSO ===== */
$('prog').innerHTML = LABELS.map(() => '<i></i>').join('');
function paintProgress() {
  [...$('prog').children].forEach((el, i) => el.classList.toggle('on', i < step));
  $('plabel').textContent = `Passo ${step} de ${TOTAL} · ${LABELS[step-1]}`;
}

/* ===== SERVIÇOS ===== */
$('grid').innerHTML = SERVICES.map(s => `
  <button type="button" class="card" data-id="${s.id}" aria-pressed="false">
    ${s.img ? `<img src="https://images.unsplash.com/${s.img}?q=80&w=400&auto=format&fit=crop" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<div class="ph" aria-hidden="true">${s.icon || s.emoji}</div>`}
    <div class="ci"><div class="cn">${s.name}</div><div class="cd">${s.desc}</div>
    <div class="cf"><span class="cp">${brl(s.price)}</span><span class="ct">⏱ ${fmtDur(s.time)}</span></div></div>
  </button>`).join('');
$('grid').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c) return;
  const s = SERVICES.find(x => x.id === c.dataset.id);
  const i = S.services.findIndex(x => x.id === s.id);
  i > -1 ? S.services.splice(i, 1) : S.services.push(s);
  c.classList.toggle('sel', i === -1); c.setAttribute('aria-pressed', i === -1);
  S.time = ''; paintCart();
});
function paintCart() {
  const t = totals();
  $('cCount').textContent = `${S.services.length} serviço(s) selecionado(s)`;
  $('cTotal').textContent = brl(t.price);
  $('cTime').textContent = '⏱ ' + fmtDur(t.time);
}

/* ===== DATA E HORÁRIOS ===== */
function setupDate() {
  const d = $('date'), now = new Date(), max = new Date();
  max.setDate(max.getDate() + CONFIG.maxDaysAhead);
  d.min = isoLocal(now); d.max = isoLocal(max);
  if (!S.date) { // primeiro dia útil disponível
    const t = new Date();
    while (CONFIG.closedDays.includes(t.getDay())) t.setDate(t.getDate() + 1);
    S.date = isoLocal(t);
  }
  d.value = S.date;
}
function isClosed(iso) { const [y,m,dd] = iso.split('-').map(Number); return CONFIG.closedDays.includes(new Date(y, m-1, dd).getDay()); }

function renderSlots() {
  const box = $('slots'), dur = totals().time;
  if (!S.date) { box.innerHTML = ''; return; }
  if (isClosed(S.date)) { box.innerHTML = '<div class="note">Não atendemos neste dia. Escolha outra data. 💜</div>'; return; }
  const booked = getBooked().filter(b => b.date === S.date);
  const now = new Date(), isToday = S.date === isoLocal(now);
  const nowMin = now.getHours()*60 + now.getMinutes() + CONFIG.minNoticeMin;
  const open = toMin(CONFIG.open), close = toMin(CONFIG.close);
  const L = CONFIG.lunch ? [toMin(CONFIG.lunch[0]), toMin(CONFIG.lunch[1])] : null;
  const list = [];
  for (let st = open; st + dur <= close; st += CONFIG.interval) {
    const en = st + dur;
    if (isToday && st < nowMin) continue;
    if (L && st < L[1] && en > L[0]) continue;
    if (booked.some(b => st < b.end && en > b.start)) continue;
    list.push(st);
  }
  if (S.time && !list.includes(toMin(S.time))) S.time = '';
  box.innerHTML = list.length
    ? list.map(st => `<button type="button" class="slot${S.time === toHM(st) ? ' sel' : ''}" data-t="${toHM(st)}">${toHM(st)}</button>`).join('')
    : '<div class="note">Sem horários livres neste dia para essa duração. Tente outra data.</div>';
}
$('slots').addEventListener('click', e => {
  const b = e.target.closest('.slot'); if (!b) return;
  S.time = b.dataset.t;
  document.querySelectorAll('.slot').forEach(x => x.classList.toggle('sel', x === b));
});
$('date').addEventListener('change', e => { S.date = e.target.value; S.time = ''; renderSlots(); });

/* ===== TELEFONE ===== */
$('phone').addEventListener('input', e => {
  let v = e.target.value.replace(/\D/g, '').slice(0, 11);
  if (v.length > 6) v = `(${v.slice(0,2)}) ${v.slice(2, v.length > 10 ? 7 : 6)}-${v.slice(v.length > 10 ? 7 : 6)}`;
  else if (v.length > 2) v = `(${v.slice(0,2)}) ${v.slice(2)}`;
  e.target.value = v;
});

/* ===== NAVEGAÇÃO ===== */
function validate(from) {
  if (from === 1) {
    const n = $('name').value.trim(), p = $('phone').value.replace(/\D/g, '');
    if (n.length < 2) { toast('Digite seu nome para continuar.'); flag($('name')); return false; }
    if (p.length < 10) { toast('Digite um WhatsApp válido com DDD.'); flag($('phone')); return false; }
    S.name = n; S.phone = $('phone').value; return true;
  }
  if (from === 2 && !S.services.length) { toast('Selecione pelo menos um serviço.'); return false; }
  if (from === 3) {
    if (!S.date || isClosed(S.date)) { toast('Escolha uma data em que atendemos.'); return false; }
    if (!S.time) { toast('Escolha um horário disponível.'); return false; }
  }
  if (from === 4) S.obs = $('obs').value.trim();
  return true;
}
function go(n) {
  step = n;
  document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
  $('step' + n).classList.add('active');
  paintProgress(); say(n);
  if (n === 3) { setupDate(); renderSlots(); }
  if (n === 4) renderSummary();
  if (n === 5) {
    const t = totals(), st = toMin(S.time);
    addBooked(S.date, st, st + t.time);
  }
  window.scrollTo({top: 0, behavior: 'smooth'});
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-next]') && validate(step)) go(step + 1);
  if (e.target.closest('[data-back]')) go(step - 1);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && step === 1 && e.target.tagName === 'INPUT' && validate(1)) go(2);
});

/* ===== RESUMO E WHATSAPP ===== */
function renderSummary() {
  const t = totals(), en = toHM(toMin(S.time) + t.time);
  $('sName').textContent = S.name;
  $('sPhone').textContent = S.phone;
  $('sDate').textContent = `${fmtDate(S.date)} · ${S.time} às ${en}`;
  $('sList').innerHTML = S.services.map(s => `<div class="row" style="border:0;padding:.25rem 0"><span style="color:var(--text)">• ${s.name}</span><span>${brl(s.price)}</span></div>`).join('');
  $('sDur').textContent = 'Duração estimada: ' + fmtDur(t.time);
  $('sTotal').textContent = brl(t.price);
}
$('waBtn').addEventListener('click', () => {
  const t = totals(), en = toHM(toMin(S.time) + t.time);
  const items = S.services.map(s => ` - ${s.name} (${brl(s.price)})`).join('\n');
  const msg = `*NOVO AGENDAMENTO - SPACE HAYR BY VALQUIRIA*\n\n*Cliente:* ${S.name}\n*WhatsApp:* ${S.phone}\n*Data:* ${fmtDate(S.date)}\n*Horário:* ${S.time} às ${en}\n\n*Serviços:*\n${items}\n\n*Total estimado:* ${brl(t.price)}\n*Duração:* ${fmtDur(t.time)}` + (S.obs ? `\n\n*Obs.:* ${S.obs}` : '') + `\n\nOlá, gostaria de confirmar este agendamento!`;
  window.open(`https://wa.me/${CONFIG.salonPhone}?text=${encodeURIComponent(msg)}`, '_blank');
});
$('restart').addEventListener('click', () => {
  Object.assign(S, {name:'', phone:'', services:[], date:'', time:'', obs:''});
  $('name').value = $('phone').value = $('obs').value = '';
  document.querySelectorAll('.card').forEach(c => { c.classList.remove('sel'); c.setAttribute('aria-pressed', 'false'); });
  paintCart(); go(1);
});

paintCart(); paintProgress(); say(1);
</script>
</body>
